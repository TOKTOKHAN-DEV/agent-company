name: 새 에이전트 제안
description: 기존 로스터에 직원을 추가합니다
labels: [agent]
body:
  - type: markdown
    attributes:
      value: |
        ### 먼저 — 정말 에이전트여야 하나요

        에이전트를 나누는 기준은 **역할이 아니라 런타임과 병렬성**입니다.
        기존 에이전트가 할 수 있는 일이면 **스킬을 추가**하세요 (`agents/<id>/skills/`).

        로스터를 8개에서 2개로 줄인 적이 있습니다. 콘텐츠 파이프라인 네 단계가 모두 같은
        파일을 순차로 건드려 병렬 실행이 불가능했기 때문입니다 — 단계는 스킬이 됐습니다.
        근거는 `wiki/06-history.md` 의 2026-07-28 항목에 있습니다.

  - type: textarea
    id: why-not-skill
    attributes:
      label: 왜 스킬이 아니라 별도 프로세스인가요
      description: |
        둘 중 하나를 보여 주세요.
        **런타임이 다르다** — 예: 이미지 생성은 codex 뿐이라 claude 에이전트로는 불가능.
        **진짜 병렬로 돈다** — 서로 다른 파일을 건드려 동시에 돌릴 수 있다.
    validations:
      required: true

  - type: input
    id: writes
    attributes:
      label: 쓰기 범위
      description: 기존 에이전트와 겹치면 병렬이 아닙니다.
      placeholder: "specs/** · assets/** · content/posts/**"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: 런타임
      options: [claude, codex]
    validations:
      required: true

  - type: textarea
    id: hard-rules
    attributes:
      label: 이 에이전트가 절대 하지 않는 일
      description: "`registry.yaml` 의 `hard_rules:` 가 됩니다."
    validations:
      required: true
