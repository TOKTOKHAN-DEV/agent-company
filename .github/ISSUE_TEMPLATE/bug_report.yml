name: 버그 신고
description: 문서대로 했는데 다르게 동작합니다
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        `pnpm check` 출력을 먼저 붙여 주시면 대부분 한 번에 좁혀집니다.

  - type: textarea
    id: check
    attributes:
      label: pnpm check 출력
      description: 이것만으로 원인이 드러나는 경우가 많습니다. 실행이 안 되면 그 에러를 적어 주세요.
      render: text
    validations:
      required: true

  - type: input
    id: template
    attributes:
      label: 현재 템플릿
      description: "`pnpm template current` 의 출력. 아직 안 펼쳤으면 그렇게 적어 주세요."
      placeholder: blog / app-in-toss / blank / 미적용
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작과 실제 동작
      description: 어느 문서의 어느 대목을 따랐는지 함께 적어 주시면 문서 쪽 문제인지 코드 쪽 문제인지 갈립니다.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 빈 폴더에서 클론부터 시작하는 순서로 적어 주세요.
      placeholder: |
        1. git clone …
        2. pnpm company-setup → blog 선택
        3. …
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "macOS 15.4 · node v22.16.0 · pnpm 10.11.0"
    validations:
      required: true
