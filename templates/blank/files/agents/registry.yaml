# ─────────────────────────────────────────────────────────────
# Agent Registry — 에이전트 · 런타임 · 모델의 단일 진실 공급원
#
# 여기 있는 에이전트는 Claude 서브에이전트가 아닙니다.
# 각자 별도 터미널에서 도는 **독립 프로세스**입니다.
#
# 실행:  pnpm agent <id> "<작업>"        (scripts/run-agent.sh)
# 추가:  /create-agent                   (손으로 만들지 마세요 — 정합성 검사에서 걸립니다)
#
# 모델 선택 기준
#   opus     — 판단 · 설계 · 검수. 틀리면 비싼 작업.
#   sonnet   — 실행 · 구현 · 변환. 명세가 명확한 작업.
#   haiku    — 분류 · 추출 · 포맷팅. 기계적인 작업.
#   default  — 해당 CLI 의 기본 모델을 그대로 사용 (플래그를 넘기지 않음).
#
# 에이전트를 늘리는 기준은 **역할이 아니라 런타임과 병렬성**입니다.
# 기존 에이전트가 할 수 있는 일이면 에이전트 대신 스킬을 추가하세요.
# ─────────────────────────────────────────────────────────────

version: 2

# 빈 로스터입니다. 첫 직원은 `/create-agent` 로 뽑으세요.
#
# 항목 형태:
#
#   - id: spec-writer
#     name: Spec Writer
#     runtime: claude          # claude | codex
#     model: opus              # opus | sonnet | haiku | default
#     summary: 한 줄로 무엇을 하는 에이전트인지.
#     writes: specs/**         # 이 범위 밖은 건드리지 않는다
#     skills: agents/spec-writer/skills
#     definition: agents/spec-writer/AGENT.md
#     hard_rules:
#       - 이 에이전트가 절대 하지 않는 일.
agents:
